{name:'交往方式',symbols:['群','独'],labels:['交流共鸣','独处自得'],descriptions:['你倾向在交流中获得回应，也愿意和别人共同探索。','你倾向给自己留出空间，在独处和深入交流中获得满足。']},

// 人格内容由用户提供；此处为唯一数据源，对照结果读取同一表。
const PERSONALITIES = {
  "0000": {
    "key": "0000",
    "number": 1,
    "type": "经世镇士型",
    "title": "乱世掌舵人",
    "representative": "桓温",
    "original": "桓公北征，经金城，见前为琅邪时种柳，皆已十围，慨然曰：“木犹如此，人何以堪！”攀枝执条，泫然流泪。",
    "translation": "桓温北伐途经金城，看见自己早年任职时栽种的柳树已长得粗壮繁茂，不由得感慨：“树木尚且经不起岁月流逝，人又怎能承受时光消磨！”他攀住柳枝，潸然落泪。",
    "interpretation": "你是一位擅长长期布局的掌舵者，懂得联结伙伴、积累资源，也让社交服务于真正想完成的事。脑子里永远优先盘算落地结果，不爱空谈虚玄大道理。就算偶尔被场景戳中，生出感慨和伤感，情绪也只是一闪而过，不会打乱长期布局。\n\n放到现实，就是大项目负责人，擅长铺长线规划，定力拉满，认准目标就稳步推进。可以感性一秒，但绝不让感性接管决策。名士氛围感：纵有怅然，不误宏图。",

  "1000": {
    "key": "1000",
    "number": 2,

    "original": "陶公性检厉，勤于事。作荆州时，敕船官悉录锯木屑，不限多少。咸不解其意。后正会，值积雪始晴，听事前除雪后犹湿，于是悉用木屑覆之，都无所妨。官用竹，皆令录厚头，积之如山。后桓宣武伐蜀，装船，悉以作钉。",
    "translation": "陶侃性情严谨自律、勤勉务实。任职荆州时，下令船官尽数收集锯木屑，众人都不理解他的用意。后来正月集会，大雪初晴，厅堂前的台阶泥泞潮湿，便用木屑铺垫，行走毫无阻碍。官府所用的竹子，他都让人留存厚实的竹根，堆积如山。后来桓温讨伐蜀国，打造战船时，这些竹根全部被用来做船钉，物尽其用。",
    "interpretation": "你是一位严谨自律、习惯未雨绸缪的笃行者，能够独处自洽，对无效社交没有太多热情。眼光盯在实实在在的物件、流程、储备上，习惯按逻辑预判风险，凡事喜欢留后手。做事有稳定节奏，愿意做短期看不出收益、但关键时刻救命的准备。\n\n现实里像靠谱技术骨干或风控，平时安静低调，不抢风头，可一出状况，大家最先指望的就是他。主打一个细水长流，一切讲求物尽其用，很少做“单纯图开心”的无用投入。名士氛围感：藏功于细，静而有备。",

  "0001": {

    "original": "王大将军年少时，旧有田舍名，语音亦楚。武帝唤时贤共言伎艺事，人皆多有所知，唯王都无所关，意色殊恶，自言知打鼓吹。帝令取鼓与之，于坐振袖而起，扬槌奋击，音节谐捷，神气豪上，傍若无人。举坐叹其雄爽。",
    "translation": "王敦年少时，乡土气息浓重，口音粗朴。晋武帝召集当世贤士谈论才艺技艺，众人皆能侃侃而谈，唯独王敦全然不懂，神色不悦，自称擅长击鼓。武帝命人取来鼓具，王敦当即振袖起身，扬槌击鼓，节奏明快铿锵，神情豪迈昂扬、旁若无人，满座之人都赞叹他的雄健豪爽。",

  "1001": {
    "key": "1001",
    "number": 4,
    "type": "匠思隐贤型",
    "title": "低调匠人",
    "representative": "戴逵",
    "original": "戴公从东出，谢太傅往看之。谢本轻戴，见但与论琴书。戴既无吝色，而谈琴书愈妙。谢悠然知其量。",
    "translation": "戴逵从江东来到京城，谢安前去探望。谢安原本轻视戴逵的名望，见面后只与他谈论琴艺、书法这类技艺小事。戴逵毫无局促不悦之色，谈论琴书义理愈发精妙通透。谢安由此从容察觉到戴逵宽广的胸襟与深厚的学识。",
    "interpretation": "你是一位偏爱独处深耕的低调匠人，不热衷于频繁应酬，更愿意用作品和技艺表达自己。兴趣大多落在技艺、实操、看得见摸得着的细节上，习惯理性拆解门道，拒绝空泛玄学。做事没有死板流程，愿意在实践里反复试错，随缘打磨，灵感来了就猛干一阵。\n\n现实里像独立手艺人、设计师、技术大佬，有真东西，但不爱主动宣传。被低估也不急着争辩，聊到擅长领域才会闪闪发光。名士氛围感：静研技艺，不事张扬，自有分量。",
    "sourceTitle": "《世说新语·雅量》",
    "sourceUrl": "https://zh.wikisource.org/wiki/世說新語/雅量",
    "family": "素实族",
    "mappingNote": "人物分类与现代解读来自你们提供的原创内容；文学故事不等同于对历史人物的完整心理判断。",

  "0010": {
    "key": "0010",
    "number": 5,
    "type": "雅和济世型",
    "title": "调和者",
    "representative": "王导",
    "original": "丞相末年，略不复省事，正封箓诺之。自叹曰：“人言我愦愦，后人当思此愦愦。”",
    "translation": "王导晚年执掌朝政，几乎不再严苛细查琐事，只对文书签字应允、宽和处事。他自我感叹道：“世人都说我糊涂慵懒，后世之人定会明白，正是这份宽和包容，才保全了江东安稳。”",
    "interpretation": "你是一位善于调和关系的协调者，能够斡旋多方，也看得懂现实里每个人的难处。判断优先顾及人的感受，追求缓和矛盾，而非硬辩输赢。包容不是无底线，内心有长期稳定的标尺，不会跟着舆论风向反复横跳。\n\n现实对标团队协调人，很会调停吵架，习惯求稳求和，愿意适度包容，维系长久和睦。容易为了大局让步，但心里清楚自己守住的底线在哪。名士氛围感：以宽济事，不逐一时口舌之胜。",
    "sourceTitle": "《世说新语·政事》",
    "sourceUrl": "https://zh.wikisource.org/wiki/世說新語/政事",
    "family": "风物族",
    "mappingNote": "人物分类与现代解读来自你们提供的原创内容；文学故事不等同于对历史人物的完整心理判断。",
    "mirrorNote": "12.独·虚·理·兴【叛逆少年｜刘伶】（合群包容济世 VS 解构世俗破规）",
    "sources": [

      }
    ]

  "1010": {
    "key": "1010",
    "number": 6,
    "type": "怀情守拙型",
    "title": "柔情赤子",
    "representative": "荀粲",
    "original": "荀奉倩与妇至笃，冬月妇病热，乃出中庭自取冷，还以身熨之。妇亡，奉倩后少时亦卒。",
    "translation": "荀粲与妻子感情极为深厚，冬日里妻子身患热病，他便走到庭院中让自己受寒变冷，再回到屋内用身体为妻子降温。妻子去世后，荀粲悲痛难抑，不久也随之离世。",
    "interpretation": "你是一位慢热专一的柔情赤子，把真心留给极少数人，也把关心落在实际行动里。理解的爱是落到行动上的，不是漂亮空话。一旦认定一份感情，这份心意会长期稳定，不会随新鲜感消散。比起浪漫构想，更愿意做实打实、看得见的付出。\n\n现实里就是行动派爱人，少说情话，多办实事。认定之后长情专一，用情很深，一旦失去，很难快速抽离。名士氛围感：情不在虚言，贵在以身相赴。",
    "sourceTitle": "《世说新语·惑溺》",
    "sourceUrl": "https://zh.wikisource.org/wiki/世說新語/惑溺",
    "family": "风物族",
    "mappingNote": "人物分类与现代解读来自你们提供的原创内容；文学故事不等同于对历史人物的完整心理判断。",
    "mirrorNote": "10.群·虚·理·兴【思辨者｜王弼】（守私情质朴 VS 入世玄思立辩）",
    "sources": [

  "0011": {
    "key": "0011",
    "number": 7,
    "type": "乘兴风流型",
    "title": "耍起贯彻者",
    "representative": "王羲之",
    "original": "①东床坦腹。郗太傅在京口，遣门生与王丞相书，求女婿。门生归白郗曰：“王家诸郎，亦皆可嘉，闻来觅婿，咸自矜持。唯有一郎，在东床上坦腹卧，如不闻。”郗公云：“正此好！”访之，乃是逸少，因嫁女与焉。\n\n②王右军得人以《兰亭集序》方《金谷诗序》，又以己敌石崇，甚有欣色。",
    "translation": "郗鉴派人去王家选女婿，王家年轻子弟听说之后，全都刻意端正拘谨，只有王羲之，敞着肚子躺在东床上，仿佛没听见这件事。郗鉴听闻，说：“就这个最好！”，于是把女儿嫁给他。\n\n又，王羲之听说有人拿他的《兰亭集序》与石崇的《金谷诗序》相比，又把自己看作可与石崇匹敌，脸上露出十分高兴的神色。",
    "interpretation": "你是一位享受同好相聚的乘兴风流者，能够自在合群，也愿意组织松弛、有趣的小聚会。注意力偏爱具象、可触摸的事物，共情力在线。行事主打“兴致优先”，讨厌强行端架子、演世俗期待的样子，计划可以随心情调整。\n\n现实对标松弛感满满的文艺组织者、兴趣博主，开心就张罗局，灵感来了就创作。最怕被死板日程捆死，热度一过，很容易把事情搁置。名士氛围感：兴之所至，不拘俗套，风流本自天然。",
    "sourceTitle": "《世说新语·雅量》、《世说新语·企羡》",
    "sourceUrl": "https://zh.wikisource.org/wiki/世說新語/雅量",
    "family": "风物族",
    "mappingNote": "人物分类与现代解读来自你们提供的原创内容；文学故事不等同于对历史人物的完整心理判断。",

  "1011": {
    "key": "1011",
    "number": 8,
    "type": "感物审美型",
    "title": "艺术家",
    "representative": "顾恺之",
    "original": "顾长康画人，或数年不点目精。人问其故，顾曰：“四体妍蚩，本无关于妙处；传神写照，正在阿堵中。”",
    "translation": "顾恺之绘制人物画像，有时数年都不画上眼珠。有人询问原因，他说：“人体四肢的美丑，原本无关画作的精妙意境；想要描摹人物的神韵风骨，关键就在这双眼之中。”",
    "interpretation": "你是一位偏爱沉浸式独处的艺术家，比起大型社交，更享受专注观察和自在创作。对现实里细微神态、光影、氛围感极其敏感，很容易被小细节打动。创作跟着灵感走，不会按固定流水线产出，追求抓住藏在物象里的情绪和灵气。\n\n现实像摄影师、插画师、氛围感文案，感知力拉满，擅长捕捉别人看不见的情绪细节。但情绪起伏跟着感受走，枯燥重复的长期任务很容易让他倦怠。名士氛围感：写形容易，传神最难，专抓心动一瞬。",
    "sourceTitle": "《世说新语·巧艺》",
    "sourceUrl": "https://zh.wikisource.org/wiki/世說新語/巧藝",
    "family": "风物族",
    "mappingNote": "人物分类与现代解读来自你们提供的原创内容；文学故事不等同于对历史人物的完整心理判断。",
    "mirrorNote": "9.群·虚·理·定【思想引领者｜何晏】（独处潜创作 VS 聚众立玄理）",
    "sources": [

  "0100": {
    "key": "0100",
    "number": 9,
    "type": "立谈宗士型",
    "title": "思想引领者",
    "representative": "何晏",
    "original": "何晏注《老子》未毕，见王弼自说注《老子》旨，何意多所短，不复得作声，但应诺诺。遂不复注，因作《道德论》。",
    "translation": "何晏注解《老子》，还没有完成。他听到王弼阐说自己注解《老子》的主旨，发现王弼的见解多处胜过自己，（何晏）说不出话来，只能连连应声。于是他不再继续作注，转而撰写了《道德论》。",
    "interpretation": "你是一位热衷观念碰撞的思想引领者，喜欢参与讨论，也乐于拆解事物的底层逻辑。比起实操干活，更沉迷概念、义理、形而上的思考。心里会搭建一套自洽的思想框架，一旦成型，会长久维护完善，不会随便跟风换新理论。\n\n现实对标哲学博主、理论型讲师，酷爱辨析定义，享受逻辑闭环。能承认别人说得更好，但不会就此放弃构建体系这件事。偶尔容易沉浸在理论世界，忽略人情现实。名士氛围感：乐于论道，求义理之完备。",
    "sourceTitle": "《世说新语·文学》",
    "sourceUrl": "https://zh.wikisource.org/wiki/世說新語/文學",
    "family": "玄思族",
    "mappingNote": "人物分类与现代解读来自你们提供的原创内容；文学故事不等同于对历史人物的完整心理判断。",
    "mirrorNote": "8.独·实·情·兴【艺术家｜顾恺之】（聚众立玄理 VS 独心潜创作）",
    "sources": [

      }

  "0101": {
    "key": "0101",
    "number": 10,
    "type": "辩思灵士型",
    "title": "思辩者",
    "representative": "王弼",
    "original": "王辅嗣弱冠诣裴徽，徽问曰：“夫无者，诚万物之所资，圣人莫肯致言，而老子申之无已，何邪？”弼曰：“圣人体无，无又不可以训，故言必及有；老、庄未免于有，恒训其所不足。”",
    "translation": "年少的王弼拜访裴徽，裴徽问道：“‘无’是世间万物的本源依托，圣人从不刻意言说，而老子却反复阐释，这是为何？”王弼答道：“圣人内心体悟‘无’的大道，但‘无’无法用言语阐释，所以言谈必然落脚于具象之‘有’；老庄尚未超脱‘有’的桎梏，所以常常阐释自身所欠缺的‘无’。”",
    "interpretation": "你是一位思维敏捷的思辨者，最爱与人交锋观点，享受灵感相互碰撞的瞬间。喜欢啃抽象、底层的大问题，不怎么关心落地实操。思路不受固定框架束缚，常常即兴蹦出新猜想，举一反三一把好手。\n\n现实对标辩手、脑洞型学霸，新角度说来就来。短板是收尾耐心不足，想法层出不穷，但很少沉下心落地做完。名士氛围感：思如泉涌，即兴开悟，胜在灵捷。",
    "sourceTitle": "《世说新语·文学》",
    "sourceUrl": "https://zh.wikisource.org/wiki/世說新語/文學",
    "family": "玄思族",
    "mappingNote": "人物分类与现代解读来自你们提供的原创内容；文学故事不等同于对历史人物的完整心理判断。",
    "mirrorNote": "6.独·实·情·定【柔情赤子｜荀粲】（入世玄思立辩VS 守私情质朴）",
    "sources": [

      }

  "1100": {
    "key": "1100",
    "number": 11,
    "type": "守道孤贤型",
    "title": "理想者",
    "representative": "嵇康",
    "original": "嵇中散临刑东市，神气不变。索琴弹之，奏《广陵散》。曲终，曰：“袁孝尼尝请学此散，吾靳固不与，《广陵散》于今绝矣！”太学生三千人上书，请以为师，不许。文王寻亦悔焉。",
    "translation": "嵇康在东市即将受刑，神色气度毫无改变。他索要古琴弹奏《广陵散》，一曲终了，叹息道：「袁准曾经请求学习这首曲子，我吝啬固执不肯传授，如今《广陵散》就此失传了！」三千名太学生上书朝廷，请求以嵇康为师，未被准许。不久，司马昭也心生悔意。",
    "interpretation": "你是一位傲骨鲜明、坚守原则的理想者，重视自己的价值判断，不愿轻易向违背本心的事妥协。喜欢独处自省，不屑无效社交、圆滑世故。精神世界极其丰富，坚守自己的底线和道义，做人做事只遵从真理和本心。性格刚正、宁折不弯，不迎合、不谄媚、不同流合污。现代对应：有原则的清流、坚守初心的追梦人、极度自律的理想主义者。人品顶配、风骨绝佳，哪怕不合群，也绝不委屈自己妥协世俗。唯一代价是过于清高，容易被世俗误解、不懂圆滑自保",
    "sourceTitle": "《世说新语·雅量》",
    "sourceUrl": "https://zh.wikisource.org/wiki/世說新語/雅量",
    "family": "玄思族",
    "mappingNote": "人物分类与现代解读来自你们提供的原创内容；文学故事不等同于对历史人物的完整心理判断。",

  "1101": {
    "key": "1101",
    "number": 12,
    "type": "解构狂士型",
    "title": "叛逆少年",
    "representative": "刘伶",
    "original": "刘伶恒纵酒放达，或脱衣裸形在屋中，人见讥之。伶曰：“我以天地为栋宇，屋室为裈衣，诸君何为入我裈中！”",
    "translation": "刘伶常年纵情饮酒、放达不羁，有时在屋内赤裸身体，旁人见状讥讽他失礼。刘伶说道：“我以天地为房屋，以屋室为衣裤，你们为何钻进我的裤子里来非议我！”",
    "interpretation": "你是一位清醒叛逆、追求自在的解构者，愿意跳出既有框架，用自己的方式理解生活。不爱合群应酬，看透世俗规则的虚伪，喜欢用自己的方式解构刻板规矩。头脑极度清醒理智，看得穿人性、看得透套路，却选择随性放达、自在活着。不被世俗标准绑架，不焦虑内卷，活得极度松弛自由。现代对应：清醒叛逆者、反焦虑达人、极简自由人。别人被规矩束缚，他们直接跳出框架活自己。短板是过于洒脱，偶尔显得离经叛道、不被世俗理解。",
    "sourceTitle": "《世说新语·任诞》",
    "sourceUrl": "https://zh.wikisource.org/wiki/世說新語/任誕",

  "0110": {
    "key": "0110",
    "number": 13,
    "type": "怀度弘士型",
    "title": "风度小生",
    "representative": "谢道韫",
    "original": "谢太傅寒雪日内集，与儿女讲论文义。俄而雪骤，公欣然曰：“白雪纷纷何所似？”兄子胡儿曰：“撒盐空中差可拟。”兄女曰：“未若柳絮因风起。”公大笑乐。",
    "translation": "一个下雪天，谢安把家里晚辈聚在一起，讨论文学义理。雪忽然下急了，谢安兴致勃勃问：纷飞白雪像什么？侄子说，像撒在空中的盐。谢道韫答：不如比作柳絮乘着风漫天飞舞。谢安听了，十分开心。",
    "interpretation": "你是一位从容参与雅集的怀度之士，享受集体探讨与同好之间的精神交流。比起客观描述“雪是什么”，更偏爱意象、诗意、氛围感这类形而上的感受。共情细腻，审美感知力强，内在风骨稳定，境遇剧变也不容易丢掉自己的审美与心性。\n\n现实对标沉静有审美的读书会组织者、文学爱好者，温和但有内核。不追求热闹喧哗，心里那份诗意与自持，能长久稳住自己。名士氛围感：妙在意象，风骨不移，温柔而有分量。",

function oppositeKey(key){return key.split('').map(v=>v==='0'?'1':'0').join('');}
function calculate(answers){
 if(answers.length!==8||answers.some(v=>v!==0&&v!==1))throw new Error('请完成全部8题');
 const mixed=AXES.map((_,i)=>answers[i]!==answers[i+4]);
 const key=answers.slice(4).join('');
 return {key,mixed,personality:PERSONALITIES[key],opposite:PERSONALITIES[oppositeKey(key)]};
}
const state={screen:'home',index:0,answers:Array(8).fill(null),locked:false,timer:null,revision:0};
const app=document.getElementById('app');
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function codeLabel(key){return key.split('').map((v,i)=>AXES[i].symbols[Number(v)]).join(' · ');}
function clearTransition(){if(state.timer!==null)clearTimeout(state.timer);state.timer=null;state.locked=false;state.revision++;}
function navigate(screen){clearTransition();state.screen=screen;render();window.scrollTo({top:0,behavior:'instant'});}
function start(){state.answers=Array(8).fill(null);state.index=0;navigate('quiz');}
function choose(value){
 if(state.screen!=='quiz'||state.locked||(value!==0&&value!==1))return false;
 state.locked=true;state.answers[state.index]=value;
 const index=state.index,revision=state.revision;
 app.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;b.classList.toggle('selected',i===value);b.setAttribute('aria-pressed',String(i===value));});
 state.timer=setTimeout(()=>{
  if(revision!==state.revision||state.screen!=='quiz'||state.index!==index)return;
  state.timer=null;state.locked=false;
  if(index===7)navigate('result');else{state.index++;render();}
 },450);
 return true;
}
function previous(){if(state.screen!=='quiz'||state.index===0)return;clearTransition();state.index--;render();}
function edit(){state.index=7;navigate('quiz');}
function card(p,opposite=false){
 const source=p.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a>`).join(' · ') + '<br>原文按提供的资料录入；外链为篇章对照阅读。';
 return `<article class="personality ${opposite?'opposite':''}"><div class="personality-head"><div class="eyebrow">${opposite?'你的另一面 · 对照人格':'你的名士人格 · 文学镜像'}</div><div class="code">${codeLabel(p.key)}</div><div class="named-card"><span class="name serif">${esc(p.representative)}</span><div><h2>${esc(p.title)}</h2><p>${esc(p.type)} · ${esc(p.family)}</p></div></div></div><section class="section"><h3>原文 · 故事的来处</h3><blockquote>${esc(p.original)}</blockquote><div class="source">${source}</div></section><section class="section"><h3>白话释义</h3><p>${esc(p.translation)}</p></section><section class="section"><h3>现代解读</h3><p>${esc(p.interpretation)}</p></section></article>`;
}
function render(){
 if(state.screen==='home'){
 app.innerHTML=`<div class="page-enter"><section class="hero"><div><div class="eyebrow">八问之间，照见一种风度</div><h1 tabindex="-1">在古人的故事里，<br>遇见自己。</h1><p class="intro">你会赴一场清谈，还是独享一段山水？<br>从八个日常选择出发，寻找属于你的名士人格。</p><button class="primary" id="start">开始八问 <span aria-hidden="true">→</span></button><p class="fine">8 道题 · 约 2 分钟 · 无需登录</p></div><div class="cover" aria-hidden="true"><svg viewBox="0 0 400 420" fill="none"><path d="M-20 340 Q50 190 125 295 Q210 125 310 280 Q350 215 430 310 V440 H-20Z" fill="#ccd7c3"/><path d="M-20 380 Q110 235 210 365 Q300 240 440 355 V440 H-20Z" fill="#b2c3a6"/><path d="M310 365 Q301 290 321 188 M320 247 Q293 224 290 198 M316 279 Q341 247 355 245" stroke="#638064" stroke-width="2"/><path d="M286 196q-20-30-22-28 2 27 22 28M291 203q-7-35 1-35 8 25-1 35M349 247q17-24 30-23-9 23-30 23M338 260q27-5 34 4-25 10-34-4" fill="#638064"/></svg><div class="cover-title">世说新语</div><div class="cover-caption">清谈 · 山水 · 意趣 · 风度</div></div></section><section class="dimensions" aria-label="四个测试维度">${AXES.map(a=>`<div class="small-card"><strong>${a.symbols.join(' / ')}</strong><p>${a.name}</p><p>${a.labels.join(' · ')}</p></div>`).join('')}</section><p class="notice">十六名士，四种风骨：素实、风物、玄思、幽怀。在日常选择中，照见你此刻的处世倾向。</p></div>`;
 document.getElementById('start').onclick=start;
 }else if(state.screen==='quiz'){
 const q=QUESTIONS[state.index];
 app.innerHTML=`<section class="quiz page-enter"><div class="topline"><span>八问 · 寻你的名士风度</span><span aria-live="polite">第 ${state.index+1} / 8 题</span></div><progress value="${state.index}" max="8" aria-label="已完成题数"></progress><div class="question-panel"><div class="eyebrow">第 ${['一','二','三','四','五','六','七','八'][state.index]} 问</div><h1 tabindex="-1">${esc(q.text)}</h1><p class="instruction">选更接近你的一项，没有标准答案。选择后将自动进入下一步。</p><div class="options">${q.options.map((o,i)=>`<button class="option ${state.answers[state.index]===i?'selected':''}" data-choice="${i}" aria-pressed="${state.answers[state.index]===i}"><span class="letter" aria-hidden="true">${i===0?'A':'B'}</span><span>${esc(o)}</span></button>`).join('')}</div></div><div class="navrow"><button class="text-button" id="back" ${state.index===0?'disabled':''}>← 上一题</button><span class="fine">${state.answers[state.index]!==null?'已保留你的选择，可重新选择。':'跟随此刻最自然的想法。'}</span></div></section>`;
 app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));
 document.getElementById('back').onclick=previous;
 }else{
 const result=calculate(state.answers);
 app.innerHTML=`<div class="page-enter"><div class="result-top"><div class="eyebrow">你的名士人格</div><h1 tabindex="-1">${esc(result.personality.title)}</h1><div class="result-name serif">${esc(result.personality.representative)}</div><p class="result-code">${codeLabel(result.key)}</p><span class="badge">${result.personality.family} · ${result.personality.type}</span></div><div class="result-grid">${card(result.personality)}<div>${card(result.opposite,true)}<p class="fine">对照人格将四个维度全部翻转，用来观察另一种选择方式，不代表历史人物彼此对立。</p></div></div><section class="axis-card" aria-label="你的四维倾向">${AXES.map((a,i)=>{const v=Number(result.key[i]);return `<div class="axis-row"><span class="axis-symbol">${a.symbols[v]}</span><div class="axis-detail"><strong>${a.name} · ${a.labels[v]}</strong><p>${result.mixed[i]?`兼具 ${a.symbols.join(' / ')} 两种倾向；按第 ${i+5} 题情境选择归类。`:'两道题选择一致，采用这一倾向。'}</p></div></div>`;}).join('')}</section><div class="result-actions"><button class="secondary" id="edit">返回修改答案</button><button class="primary" id="restart">重新测试 ↻</button></div><p class="explanation">每个维度对应两题；不一致时以第 5—8 题为准。这是本站的趣味分类规则，未经过心理测量验证。上述类型、称号和现代解读为原创；古文内容采用你们提供的资料，外链供对照查阅，不代表已进行逐字校勘。</p></div>`;
 document.getElementById('restart').onclick=start;document.getElementById('edit').onclick=edit;
 }
 const heading=app.querySelector('h1');if(heading)heading.focus({preventScroll:true});
}
render();
</script>
